name: Live forecast

# Twice a day: the 18:00 run replaces the 12:00 one in case some data before the 09:00 UTC
# cut-off arrived late. Both only use data up to 09:00.
on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    # The first run downloads five years of data, slowly from GitHub's shared IPs. Later runs
    # only fetch the latest quarter.
    timeout-minutes: 300
    env:
      REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      PYTHONWARNINGS: ignore
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Restore downloaded data
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Get the published history
        run: git clone -q --depth 1 --branch live "$REMOTE" live || mkdir live

      - name: Forecast tomorrow
        timeout-minutes: 270  # shorter than the job, so the save step below still gets to run
        run: energy-forecast live --out live

      # Saved even when the forecast fails or times out, so the next run continues the download.
      - name: Save downloaded data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}

      - name: Publish to the live branch
        working-directory: live
        run: |
          rm -rf .git
          git init -q -b live
          git add history.csv recent.csv status.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Forecast issued $(jq -r .issued status.json)"
          git push -q --force "$REMOTE" live
