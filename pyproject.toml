[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-forecast"
version = "0.1.0"
description = "Probabilistic electricity load and price forecasting for European markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "requests>=2.31",
    "pyyaml>=6",
    "statsforecast>=2.0",
    "lightgbm>=4.5",
    "holidays>=0.60",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
energy-forecast = "energy_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# pandas 2.x vs NumPy >= 2.5; harmless. statsforecast doesn't support pandas 3 yet.
filterwarnings = ["ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning"]
